name: Build Windows EXE & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate application icon
        run: python generate_icon.py

      - name: Build Videomatik.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "Videomatik" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.ico;assets" `
            --collect-all customtkinter `
            --collect-all imageio_ffmpeg `
            --collect-all curl_cffi `
            --collect-all yt_dlp_ejs `
            app.py

      - name: Upload Videomatik.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Videomatik-Windows-EXE
          path: dist/Videomatik.exe

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Videomatik ${{ github.ref_name }} (Windows .exe)"
          body: |
            ## Videomatik — Kurulumsuz Windows Uygulaması (.exe)

            ### Nasıl Kullanılır?
            1. Aşağıdaki **Assets** bölümünden **`Videomatik.exe`** dosyasını indirin ve çift tıklayarak açın (Python kurulumu gerektirmez).
            2. Uygulama açıldığında sağ üstteki **"Masaüstüne Kısayol Ekle"** butonuna tıklayarak Masaüstünüze uygulama kısayolunu oluşturabilirsiniz.
          files: |
            dist/Videomatik.exe
          draft: false
          prerelease: false
